<!-- templates/password-page.html -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Protected</title>
<style>
  body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#0b0b0c;color:#eee}
  form{display:grid;gap:12px;width:min(320px,90vw)}
  input{padding:12px;border-radius:8px;border:1px solid #333;background:#161618;color:#eee;font-size:16px}
  button{padding:12px;border-radius:8px;border:0;background:#3b82f6;color:#fff;font-size:16px;cursor:pointer}
  .err{color:#f87171;min-height:1.2em;font-size:14px}
</style></head>
<body><form method="POST">
  <div class="err">{{ERROR}}</div>
  <input type="password" name="password" placeholder="Password" autofocus required>
  <button type="submit">Enter</button>
</form></body></html>
